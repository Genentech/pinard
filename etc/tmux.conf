# Pinard tmux config — source from ~/.tmux.conf or per-socket:
#   tmux -L pinard-<vignoble> source-file /path/to/pinard/etc/tmux.conf
#
# Or add to ~/.tmux.conf:
#   source-file ~/pinard/etc/tmux.conf

# Session picker (prefix+f) — switch between conductor and workers
bind f display-popup -E -w 70% -h 60% "pinard-picker"

# Status bar: show socket name (= vignoble) and session list
set -g status-left "[#(echo $TMUX_PINARD_SOCKET | sed 's/pinard-//')] "
set -g status-left-length 20
set -g status-right "#{session_name}"
set -g window-status-current-format "#[bold]#{session_name}"
