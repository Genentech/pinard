apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pinard-nats.fullname" . }}
  labels:
    {{- include "pinard-nats.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "pinard-nats.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "pinard-nats.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config-secret.yaml") . | sha256sum }}
      labels:
        {{- include "pinard-nats.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nats
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["nats-server"]
          args:
            - "--config"
            - "/etc/nats/nats-server.conf"
          env:
            - name: SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # User passwords, injected from the auth Secret and expanded by
            # nats-server into the config's $NATS_* placeholders. Rotating a
            # password (e.g. in Vault) requires a pod restart to re-read env.
            - name: NATS_SYS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pinard-nats.authSecretName" . }}
                  key: sys-password
            {{- range .Values.accounts }}
            - name: NATS_PW_{{ include "pinard-nats.envName" .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "pinard-nats.authSecretName" $ }}
                  key: {{ .name }}-password
            {{- end }}
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: cluster
              containerPort: 6222
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
            {{- if .Values.websocket.enabled }}
            - name: websocket
              containerPort: {{ .Values.websocket.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: data
              mountPath: /data
      volumes:
        - name: config
          secret:
            secretName: {{ include "pinard-nats.fullname" . }}-config
      nodeSelector:
        env: default
        {{- with .Values.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
