{{- if .Values.vault.enabled }}
{{- $v := .Values.vault }}
# Vault-backed NATS auth. External Secrets Operator pulls each password from Vault
# and materializes the auth Secret consumed by the StatefulSet ($NATS_* env). The
# passwords are NEVER in git or the Helm release — only the Vault key names are.
# Seed Vault with the CURRENT passwords before deploying, or existing clients
# (credentials.yaml on every host) will fail to authenticate.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "pinard-nats.authSecretName" . }}
  labels:
    {{- include "pinard-nats.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  refreshInterval: {{ $v.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $v.secretStore }}
  target:
    name: {{ include "pinard-nats.authSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: sys-password
      remoteRef:
        key: {{ $v.path }}
        property: {{ required "vault.sysPasswordKey is required when vault.enabled" $v.sysPasswordKey }}
    {{- range .Values.accounts }}
    - secretKey: {{ .name }}-password
      remoteRef:
        key: {{ $v.path }}
        property: {{ required (printf "vault.accountPasswordKeys.%s is required" .name) (index $v.accountPasswordKeys .name) }}
    {{- end }}
{{- end }}
