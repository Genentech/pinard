apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pinard-nats.fullname" . }}-config
  labels:
    {{- include "pinard-nats.labels" . | nindent 4 }}
type: Opaque
stringData:
  nats-server.conf: |
    server_name: $SERVER_NAME

    listen: 0.0.0.0:4222
    http_port: 8222

    {{- if .Values.jetstream.enabled }}
    jetstream {
      store_dir: /data/jetstream
      max_mem: {{ .Values.jetstream.maxMemory }}
      max_file: {{ .Values.jetstream.maxFile }}
    }
    {{- end }}

    {{- if gt (int .Values.replicaCount) 1 }}
    cluster {
      name: {{ include "pinard-nats.fullname" . }}
      listen: 0.0.0.0:6222
      routes: [
        {{- $fullname := include "pinard-nats.fullname" . }}
        {{- range $i := until (int .Values.replicaCount) }}
        nats-route://{{ $fullname }}-{{ $i }}.{{ $fullname }}-headless:6222
        {{- end }}
      ]
    }
    {{- end }}

    {{- if .Values.websocket.enabled }}
    websocket {
      listen: "0.0.0.0:{{ .Values.websocket.port }}"
      no_tls: true
      {{- if .Values.websocket.advertise }}
      advertise: "{{ .Values.websocket.advertise }}"
      {{- end }}
    }
    {{- end }}

    {{- if .Values.accounts }}
    # Passwords are injected as env vars from the auth Secret (see statefulset.yaml)
    # and expanded here by nats-server — never inlined into this config. NATS only
    # expands *unquoted* $VARS, so these must stay unquoted.
    accounts {
      {{- range .Values.accounts }}
      {{ .name }}: {
        jetstream: enabled
        users: [
          { user: {{ .name }}, password: $NATS_PW_{{ include "pinard-nats.envName" .name }} }
        ]
      }
      {{- end }}
      SYS: {
        users: [
          { user: sys, password: $NATS_SYS_PASSWORD }
        ]
      }
    }
    system_account: SYS

    # Block unauthenticated connections (no anonymous access to implicit $G account)
    authorization {
      timeout: 3
    }
    {{- end }}
