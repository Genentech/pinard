{{- if .Values.website.enabled }}
{{- $c := .Values.website }}
{{- $name := printf "%s-website" (include "pinard.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "pinard.labels" (dict "root" $ "component" "website") | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  selector:
    matchLabels:
      {{- include "pinard.selectorLabels" (dict "root" $ "component" "website") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pinard.selectorLabels" (dict "root" $ "component" "website") | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: website
          image: "{{ $c.image.repository }}:{{ $c.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $c.image.pullPolicy }}
          {{- with $c.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml $c.resources | nindent 12 }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pinard.labels" (dict "root" $ "component" "website") | nindent 4 }}
spec:
  type: {{ $c.service.type }}
  ports:
    - port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pinard.selectorLabels" (dict "root" $ "component" "website") | nindent 4 }}
{{- if $c.ingressRoute.enabled }}
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "pinard.labels" (dict "root" $ "component" "website") | nindent 4 }}
  {{- with $c.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml $c.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ required "website.ingressRoute.host is required" $c.ingressRoute.host }}`)
      kind: Rule
      services:
        - name: {{ $name }}
          port: {{ $c.service.port }}
      {{- with $c.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $c.ingressRoute.tls }}
  tls:
    {{- toYaml $c.ingressRoute.tls | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
