{{- if .Values.surrealdb.enabled }}
{{- $c := .Values.surrealdb }}
{{- $name := printf "%s-surrealdb" (include "pinard.fullname" .) }}
{{- $secretName := printf "%s-auth" $name }}
{{- $vaultSecretName := printf "%s-vault" $name }}
{{- $pvcName := printf "%s-data" $name }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $secretName }}
# ── surrealdb auth secret (root password — preserved across upgrades) ──
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "pinard.labels" (dict "root" $ "component" "surrealdb") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  root-user: {{ $c.surrealdb.rootUser | quote }}
  {{- if not $c.vault.enabled }}
  root-pass: {{ if $existing }}{{ index $existing.data "root-pass" | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  {{- end }}
{{- if $c.vault.enabled }}
{{- $v := $c.vault }}
---
# ── Vault-backed surrealdb root password (External Secrets Operator) ──
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $vaultSecretName }}
  labels:
    {{- include "pinard.labels" (dict "root" $ "component" "surrealdb") | nindent 4 }}
spec:
  refreshInterval: {{ $v.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $v.secretStore }}
  target:
    name: {{ $vaultSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: root-pass
      remoteRef: { key: {{ $v.path }}, property: {{ $v.passwdKey }} }
{{- end }}
---
{{- if and $c.persistence.enabled (not $c.persistence.existingClaim) }}
# ── PVC (Retain — patched PV keeps data across chart reinstalls) ──
# Skipped when persistence.existingClaim is set (e.g. a static EBS PV/PVC
# declared in pinard-infra app-bootstrap for durable Retain storage).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvcName }}
  labels:
    {{- include "pinard.labels" (dict "root" $ "component" "surrealdb") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $c.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "pinard.labels" (dict "root" $ "component" "surrealdb") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pinard.selectorLabels" (dict "root" $ "component" "surrealdb") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ $c.surrealdb | toYaml | sha256sum }}
      labels:
        {{- include "pinard.selectorLabels" (dict "root" $ "component" "surrealdb") | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
      containers:
        - name: surrealdb
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $c.image.pullPolicy }}
          command: {{ toYaml $c.command | nindent 12 }}
          args:
            - "--bind"
            - {{ $c.surrealdb.bind | quote }}
            - "--user"
            - "$(SURREAL_USER)"
            - "--pass"
            - "$(SURREAL_PASS)"
            {{- range $c.surrealdb.extraArgs }}
            - {{ . | quote }}
            {{- end }}
            - "surrealkv://{{ $c.surrealdb.dataPath }}"
          env:
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: root-user
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ if $c.vault.enabled }}{{ $vaultSecretName }}{{ else }}{{ $secretName }}{{ end }}
                  key: root-pass
            {{- with $c.surrealdb.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if $c.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $c.persistence.existingClaim | default $pvcName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "pinard.labels" (dict "root" $ "component" "surrealdb") | nindent 4 }}
spec:
  type: {{ $c.service.type }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "pinard.selectorLabels" (dict "root" $ "component" "surrealdb") | nindent 4 }}
{{- end }}
