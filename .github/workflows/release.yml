name: Release

# Tag-driven GitHub release. Nothing is ever pushed to `main` from CI — the branch
# stays protected (changes land only via pull request). To cut a release, create and
# push a `v<semver>` tag (e.g. after merging a `chore(release)` version-bump PR, or
# locally: `git tag v0.62.0 && git push origin v0.62.0`). This workflow then creates
# a GitHub Release from that tag; docker-publish.yml builds and pushes the GHCR
# images from the same tag.
#
# Why tag-driven (not auto-bump-on-push): pushing a `cz bump` commit + tag directly
# to `main` violates branch-protection ("changes must go through a PR"). Rather than
# grant a CI actor a bypass on `main`, the version bump is a normal PR and the tag is
# the release trigger — consistent with the project's no-direct-push-to-main rule.
#
# Gaps vs the GitLab flow (documented, not faked):
#   - olympus-cd: triggers Flux CD reconciliation on an internal cluster — not
#     reachable from GitHub Actions. See "Releasing on GitHub" in docs/github-setup.md.
#   - bump-chart: internal Helm chart lineage; not shipped in the public mirror.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<semver> tag to (re)create a release for"
        required: true

permissions:
  contents: write # create GitHub Release (no push to main)

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: version
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          # Release tags are "v<semver>" (e.g. v0.62.0); strip the leading "v".
          VERSION="${REF#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          # Pull the section for this version from CHANGELOG.md if present.
          # cz writes headings like "## v0.60.0 (2026-09-15)".
          python3 - <<'EOF'
          import re
          version = "${{ steps.version.outputs.version }}"
          try:
              with open("CHANGELOG.md") as f:
                  text = f.read()
          except FileNotFoundError:
              raise SystemExit(0)  # no changelog — release with auto-generated notes
          pattern = rf"(## v{re.escape(version)}.*?)(?=\n## |\Z)"
          m = re.search(pattern, text, re.DOTALL)
          if not m:
              raise SystemExit(0)  # no entry — release with auto-generated notes
          with open("/tmp/release-notes.md", "w") as f:
              f.write(m.group(1).strip())
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES_FILE="/tmp/release-notes.md"
          if [[ -s "$NOTES_FILE" ]]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi

      # ── olympus-cd (GitOps trigger) ──────────────────────────────────────────
      # The GitLab flow runs an `olympus-cd` job after release that amends the app
      # GitRepository watched by Flux CD, triggering a Kubernetes rollout. That
      # depends on internal infrastructure (olympus, Flux, cluster credentials)
      # not reachable from GitHub Actions. See "Releasing on GitHub — olympus-cd
      # gap" in docs/github-setup.md to wire it up for a self-hosted deployment.
